name: Build and publish image

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"   # daily: picks up new CloudCLI / Claude Code / Codex releases
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64   # drop the one your NAS doesn't need to halve build time

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest npm versions
        id: v
        run: |
          echo "cloudcli=$(npm view @cloudcli-ai/cloudcli version)" >> "$GITHUB_OUTPUT"
          echo "claude=$(npm view @anthropic-ai/claude-code version)" >> "$GITHUB_OUTPUT"
          echo "codex=$(npm view @openai/codex version)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.v.outputs.cloudcli }}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CLOUDCLI_VERSION=${{ steps.v.outputs.cloudcli }}
            CLAUDE_CODE_VERSION=${{ steps.v.outputs.claude }}
            CODEX_VERSION=${{ steps.v.outputs.codex }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
