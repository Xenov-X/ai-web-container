# Copy this to the NAS (e.g. /volume1/docker/cloudcli) and create a Container Manager project from it.
services:
  cloudcli:
    image: ghcr.io/xenov-x/ai-web-container:latest
    container_name: cloudcli
    restart: unless-stopped
    # user: "1026:100"   # optional: your DSM uid:gid so project files aren't root-owned
    ports:
      - "3001:3001"
    volumes:
      - /volume1/docker/cloudcli/home:/home/app
      - /volume1/docker/cloudcli/projects:/home/app/projects
